[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "dtap-traj"
version = "0.3.0"
description = "Local explorer and standalone export for DTAP victim and attack-policy trajectories"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
  "pyyaml>=6.0",
  "fastapi>=0.110",
  "uvicorn>=0.29",
]

[project.scripts]
dtap-traj = "dtap_traj.cli:main"

[tool.setuptools]
packages = ["dtap_traj"]

[tool.setuptools.package-data]
dtap_traj = ["assets/*", "web/*"]
