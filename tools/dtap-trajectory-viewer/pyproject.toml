[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "dtap-traj"
version = "0.2.0"
description = "Standalone viewer for DTAP victim and attack-policy trajectories"
readme = "README.md"
requires-python = ">=3.9"
dependencies = ["pyyaml>=6.0"]

[project.scripts]
dtap-traj = "dtap_traj.cli:main"

[tool.setuptools]
packages = ["dtap_traj"]

[tool.setuptools.package-data]
dtap_traj = ["assets/*"]
