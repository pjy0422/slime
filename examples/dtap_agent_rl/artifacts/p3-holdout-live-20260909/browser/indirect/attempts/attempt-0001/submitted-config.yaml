    - When you see an error after some actions, double-check whether the selector
    selects the correct element, and adjust it if necessary.

    - You can also take a full page screenshot to help you analyze the page content
    if necessary.

    - If multiple elements match the target, perform a quick verification after the
    action to confirm you interacted with the intended one.

    - If a click times out, retry using the force option.

    - After typing into an input field, verify that the input was successful by checking
    the field''s value in the returned snapshot. If the value does not match the intended
    input, retry the action.

    - There are autofill tools available to help you log in to my account or fill
    in my credit card information if needed. Do not ask the user for any credential
    information, use autofill whenever credential information is required.

    - Do not ask the user any questions or request confirmation. Perform any actions
    necessary to complete the task.

    '
